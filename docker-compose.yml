services:
  mysql:
    container_name: ${MYSQL_CONTAINER_NAME}
    image: mysql:latest
    ports:
      - ${MYSQL_PORT}:${MYSQL_EXTERNAL_PORT}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - database:/var/lib/mysql
    networks:
      - network

  phpmyadmin:
    container_name: ${PHPMYADMIN_CONTAINER_NAME}
    image: phpmyadmin:latest
    ports:
      - ${PHPMYADMIN_PORT}:${PHPMYADMIN_EXTERNAL_PORT}
    environment:
      - PMA_ARBITRARY=1
    networks:
      - network

  wordpress:
    container_name: ${WORDPRESS_CONTAINER_NAME}
    build:
      context: .
    user: "0:0"
    ports:
      - ${WORDPRESS_PORT}:${WORDPRESS_EXTERNAL_PORT}
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG}
      # skips strict file ownership verification
      WORDPRESS_CONFIG_EXTRA: |
        define('FS_METHOD', 'direct');
    volumes:
      # 1. WordPress Base (Core, wp-config, uploads, 3rd party plugins)
      - ./core:/var/www/html:z

      # 2. Your themes under development:
      # Mounts the 'src/' content of your theme directly into the theme folder in WordPress
      - ./workspace/themes/${DEV_THEME}/src:/var/www/html/wp-content/themes/${DEV_THEME}

      # 3. Your plugins under development (Example, when applicable):
      - ./workspace/plugins/${DEV_PLUGIN}/src:/var/www/html/wp-content/plugins/${DEV_PLUGIN}

    networks:
      - network

networks:
  network:
    driver: bridge

volumes:
  database:
